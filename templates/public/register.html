{% extends 'base.html' %}
{% load static %}

{% block title %}Register | ArshithGroup{% endblock %}

{% block content %}
<section class="py-5" style="background: var(--ag-peach-bg); min-height: 85vh;">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="p-4 p-md-5 bg-white rounded-4 border shadow-lg">
          <div class="text-center mb-4">
            <div class="arshith-brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
              <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="h4 font-weight-bold text-dark mb-1">Create an Account</h2>
            <p class="small text-muted mb-0">Join thousands of learners on <strong>ArshithGroup</strong></p>
          </div>

          <form id="register-form">
            <div class="mb-3">
              <label class="form-label small font-weight-bold text-dark">Full Name</label>
              <input type="text" id="full_name" class="form-control rounded-3 py-2" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
              <label class="form-label small font-weight-bold text-dark">Email Address</label>
              <input type="email" id="email" class="form-control rounded-3 py-2" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label small font-weight-bold text-dark">Password</label>
              <input type="password" id="password" class="form-control rounded-3 py-2" placeholder="At least 8 characters" required>
            </div>
            <div class="mb-4">
              <label class="form-label small font-weight-bold text-dark">Confirm Password</label>
              <input type="password" id="confirm_password" class="form-control rounded-3 py-2" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn-arshith-getstarted w-100 py-2 fs-6">Register Now</button>
          </form>

          <div class="text-center mt-4 small text-muted">
            Already have an account? <a href="{% url 'login' %}" class="text-success font-weight-bold">Log In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const full_name = document.getElementById('full_name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const confirm_password = document.getElementById('confirm_password').value;

  if (password !== confirm_password) {
    API.showToast('Passwords do not match', 'error');
    return;
  }

  try {
    const data = await API.fetch('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify({ full_name, email, password })
    });
    API.showToast('Registration successful! Logging in...', 'success');
    setTimeout(() => window.location.href = '/dashboard/', 600);
  } catch (err) {
    API.showToast(err.message || 'Registration failed', 'error');
  }
});
</script>
{% endblock %}
